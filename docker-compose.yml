version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: elearning_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: elearning_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elearning_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/elearning_db
      AI_SERVICE_URL: http://ai_service:8000
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: elearning_ai_service
    restart: always
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: elearning_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
