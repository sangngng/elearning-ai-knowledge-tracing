# Default: `docker compose up -d` starts PostgreSQL (applies backend/db/schema.sql) and Adminer,
# a web page to browse the database at http://localhost:8081 .
# Application containers are opt-in profiles and need the Dockerfiles from task S1-4:
#   docker compose --profile app up -d --build
#   docker compose --profile ai up -d --build      (AI lane, see management/ROADMAP.md section 5)
services:
  postgres:
    image: postgres:15-alpine
    container_name: elearning_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elearning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elearning"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    container_name: elearning_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    profiles: ["app"]
    build:
      context: ./backend
    container_name: elearning_backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/elearning
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the shell or a root .env file}
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: elearning_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  ai_service:
    profiles: ["ai"]
    build:
      context: ./ai_service
    container_name: elearning_ai_service
    restart: unless-stopped
    ports:
      - "8000:8000"

volumes:
  postgres_data:
